spring.application.name=urlshortener
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:urlshortener.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
shortener.public-base-url=${SHORT_URL_BASE_URL:http://localhost:3000}
spring.cache.cache-names=alias-resolutions
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60s
management.otlp.metrics.export.enabled=false
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
