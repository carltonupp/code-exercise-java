services:
  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: jdbc:sqlite:/data/urlshortener.db
    ports:
      - "8080:8080"
    volumes:
      - api-data:/data

  web:
    build:
      context: ./web
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
