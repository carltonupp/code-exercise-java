services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: jdbc:sqlite:/data/urlshortener.db
      SHORT_URL_BASE_URL: ${SHORT_URL_BASE_URL:-http://localhost:3000}
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:-false}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:-}
      MANAGEMENT_OTLP_METRICS_EXPORT_STEP: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:-1m}
      OTEL_EXPORTER_OTLP_METRICS_HEADERS: ${OTEL_EXPORTER_OTLP_METRICS_HEADERS:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-data:/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  api-data:
