services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: jdbc:sqlite:/data/urlshortener.db
      SHORT_URL_BASE_URL: ${SHORT_URL_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    volumes:
      - api-data:/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
